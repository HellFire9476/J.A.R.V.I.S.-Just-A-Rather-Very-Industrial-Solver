name: Build and publish Windows release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install build dependencies
        run: python -m pip install -r requirements.txt

      - name: Run updater tests
        run: python -m unittest discover -s tests -v

      - name: Verify release tag matches app version
        run: |
          $source = Get-Content main.py -Raw
          $versionMatch = [regex]::Match($source, 'VERSION_APPLICATION\s*=\s*"([^"]+)"')
          if (-not $versionMatch.Success) {
            throw "VERSION_APPLICATION is missing from main.py."
          }
          $sourceVersion = $versionMatch.Groups[1].Value
          $tagVersion = $env:GITHUB_REF_NAME.TrimStart('v')
          if ($sourceVersion -ne $tagVersion) {
            throw "Release tag $tagVersion does not match app version $sourceVersion."
          }

      - name: Build Windows executable
        run: python -m PyInstaller --noconfirm JARVIS.spec

      - name: Create GitHub Release and upload executable
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" .\dist\JARVIS.exe --title "J.A.R.V.I.S. $env:GITHUB_REF_NAME" --generate-notes
