
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-industrial-solver"
version = "2.0.0"
description = "Just A Rather Very Industrial Solver - Satisfactory Production Manager"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "PySide6>=6.10",
    "PyQtGraph>=0.14",
    "pydantic>=2.12",
    "networkx>=3.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "pytest-qt>=4.5",
    "ruff>=0.14",
]

[project.scripts]
jarvis = "jarvis.bootstrap:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
